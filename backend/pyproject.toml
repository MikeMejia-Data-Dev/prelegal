[project]
name = "backend"
version = "0.1.0"
description = "Prelegal backend API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.7",
    "litellm>=1.109.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
